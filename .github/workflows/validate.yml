name: Quality and security checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_APP_ENV: ci
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role
  OPENAI_API_KEY: test-openai-key
  OPENAI_MODEL: gpt-4o-mini
  STRIPE_SECRET_KEY: sk_test_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_placeholder
  STRIPE_PRICE_STARTER: price_starter_placeholder
  STRIPE_PRICE_PRO: price_pro_placeholder
  STRIPE_PRICE_PREMIUM: price_premium_placeholder
  STRIPE_PRO_FIRST_MONTH_COUPON_ID: coupon_placeholder
  RESEND_API_KEY: resend_placeholder
  EMAIL_FROM: AtendeZap IA <noreply@example.com>
  ADMIN_EMAILS: admin@example.com

jobs:
  validate:
    name: Quality and security checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run secret scan
        run: npm run check:secrets

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm test
